openapi: 3.1.0
info:
  title: Laag ta bAI API
  version: 0.1.0
  description: |
    Backend API for the Laag ta bAI PWA. This file is the contract between
    `laag-ta-bai-api` and `laag-ta-bai-frontend`; update it in the same PR as
    any route change, and mirror the change in the frontend's `src/api/types.ts`.

    Authentication: send the Supabase Auth access token as
    `Authorization: Bearer <token>`. In local memory mode only, `Bearer dev:<user-id>`
    is accepted as well.

    Every successful response is wrapped as `{ "data": ... }`. Every error is
    `{ "error": { "code", "message", "details"? } }`.
servers:
  - url: http://localhost:3000
    description: Local
security: []
tags:
  - name: system
    description: Health and diagnostics
  - name: auth
    description: User authentication and registration
  - name: landmarks
    description: Landmark search and details
  - name: ai
    description: Gemini-backed scan and chat
  - name: commute
    description: Public transit directions to heritage landmarks
  - name: progress
    description: Profile, XP, quests and visits

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Liveness check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  dataSource: { type: string, enum: [memory, supabase] }
                  ai: { type: string, enum: [gemini, stub] }
                  version: { type: string }

  /v1/auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Register a new traveler account (SRS 3.1.6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, displayName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                displayName: { type: string, minLength: 1, maxLength: 60 }
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: string }
                          displayName: { type: string }
                      session:
                        type: [object, 'null']
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          tokenType: { type: string }
                          expiresIn: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate traveler and return session token (SRS 3.1.6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: string }
                          displayName: { type: string }
                      session:
                        type: [object, 'null']
                        properties:
                          accessToken: { type: string }
                          refreshToken: { type: string }
                          tokenType: { type: string }
                          expiresIn: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password recovery email
      description: Returns a generic acknowledgement regardless of whether an email is sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Recovery request acknowledged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordRecoveryMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using an emailed recovery token
      description: Verify the recovery token and update its account. A new email is needed if the token has expired or was consumed by a failed update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tokenHash, password]
              properties:
                tokenHash: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  writeOnly: true
                  description: Up to 72 UTF-8 bytes, subject to the Supabase project password policy.
      responses:
        '200':
          description: Password updated. The traveler can sign in again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordRecoveryMessage' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Verify session token and retrieve current traveler
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          email: { type: [string, 'null'] }
                          displayName: { type: string }
                      profile: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/landmarks:
    get:
      operationId: listLandmarks
      tags: [landmarks]
      summary: Search, filter and sort landmarks (SRS 3.1.4)
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Matches name, district or category' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/LandmarkCategory' } }
        - { name: free, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: minRating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 }, description: 'Supply together with lng; adds distanceMeters and sorts nearest first' }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: 0 }, description: 'Applied when lat/lng are present; ignored without coordinates for existing client compatibility' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Landmarks without story text
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LandmarkSummary' } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/landmarks/nearby:
    get:
      operationId: nearbyLandmarks
      tags: [landmarks]
      summary: Places nearby the supplied location (task 35)
      description: |
        Both coordinates are required. Returns landmarks within radiusKm, nearest first.
        Defaults to a 5 km radius and 10 results. Distances are radial, not road distances.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, required: true, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: 0, default: 5 } }
        - { $ref: '#/components/parameters/LandmarkSearch' }
        - { $ref: '#/components/parameters/LandmarkCategory' }
        - { $ref: '#/components/parameters/FreeAdmission' }
        - { $ref: '#/components/parameters/MinimumRating' }
        - { $ref: '#/components/parameters/DiscoveryLimit' }
      responses:
        '200': { $ref: '#/components/responses/LandmarkList' }
        '400': { $ref: '#/components/responses/Error' }

  /v1/landmarks/{id}:
    get:
      operationId: getLandmark
      tags: [landmarks]
      summary: Landmark detail with categorized story (SRS 3.1.1.3, 3.1.1.4)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Landmark
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Landmark' }
        '404': { $ref: '#/components/responses/Error' }

  /v1/landmarks/popular:
    get:
      operationId: popularLandmarks
      tags: [landmarks]
      summary: Popular landmarks (task 36)
      description: |
        Sorts by rating descending, then visitCount descending, then id ascending.
        Applies filters and sorting before the limit. This follows the current frontend's
        rating-first definition of popularity.
        Coordinates are optional and must be supplied together. radiusKm requires both.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Matches name, district or category' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/LandmarkCategory' } }
        - { name: free, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: minRating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
        - { name: radiusKm, in: query, schema: { type: number, exclusiveMinimum: 0 } }
      responses:
        '200':
          description: Landmark summaries; an empty list when nothing matches
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/LandmarkSummary' } }
        '400': { $ref: '#/components/responses/Error' }

  /v1/quests:
    get:
      operationId: listQuests
      tags: [progress]
      summary: Quests, with the caller's progress when signed in (SRS 3.1.3.3)
      security: [{}, { bearerAuth: [] }]
      responses:
        '200':
          description: Quests
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/QuestProgress' } }

  /v1/scan:
    post:
      operationId: scanLandmark
      tags: [ai]
      summary: Identify a landmark from a photo (SRS 3.1.1.1-3.1.1.2)
      description: |
        Rate limited to 20 requests per minute per IP. Awards XP when signed in and identified.
        `status` values: `identified` (confidence >= 0.8 and within 500 m when GPS is sent),
        `low_confidence`, `not_nearby`, `unrecognized`. For the last three, show `candidates`
        (landmarks within 1 km) and retake guidance.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: 'JPEG, PNG or HEIC, max 10 MB' }
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Scan result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ScanResult' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/chat:
    post:
      operationId: chatWithGuide
      tags: [ai]
      summary: Ask the AI guide about a landmark (SRS 3.1.2)
      description: |
        The client holds the transcript and sends it every turn; the server keeps the
        last 30 messages (15 exchanges). Rate limited to 30 requests per minute per IP.
        The last input message must be from the user. Client timestamps are optional.
        Replies include a server-generated createdAt and fit within the input message length limit.
        With no Gemini key replies are explicitly labeled as stubs. AI failures return 503.
      security: [{}, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [landmarkId, messages]
              properties:
                landmarkId: { type: string, minLength: 1, maxLength: 200 }
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/ChatMessage' }
      responses:
        '200':
          description: Guide reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { $ref: '#/components/schemas/ChatReply' }
                      progress: { oneOf: [{ $ref: '#/components/schemas/ProgressUpdate' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /v1/commute:
    post:
      operationId: findCommute
      tags: [commute]
      summary: Local transit navigation to a landmark (task 36, SRS 3.1.5)
      description: |
        Resolves a destination from the landmark database and requests Google Routes TRANSIT
        directions from the supplied origin. Rate limited to 20 requests/minute/IP.
        Requires the server GOOGLE_MAPS_API_KEY with Routes API enabled. Returns no_routes
        when Google has no coverage for that journey; never invents jeepney codes or fares.
        Coordinates are sent to Google for this request and are not persisted by this handler.
        Display Google's required attribution and returned transit agency attribution with directions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommuteInput' }
      responses:
        '200':
          description: Transit routes or an explicit no_routes result
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/CommuteResult' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        '504': { $ref: '#/components/responses/Error' }

  /v1/me:
    get:
      operationId: getMe
      tags: [progress]
      summary: Current traveler's profile, rank, stats, badges and visits (SRS 3.1.6.1)
      description: The bearer token identifies the traveler. The request does not take a user ID.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile bundle
          headers:
            Cache-Control:
              description: Prevents caching of personal profile data.
              schema: { type: string, const: 'private, no-store' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      tags: [progress]
      summary: Update profile fields
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/visits:
    post:
      operationId: createVisit
      tags: [progress]
      summary: Manual check-in at a landmark; awards XP once per landmark per day
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [landmarkId]
              properties:
                landmarkId: { type: string }
      responses:
        '201':
          description: Visit recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/ProgressUpdate'
                      - type: object
                        properties:
                          visit: { $ref: '#/components/schemas/Visit' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/me/saved-places:
    post:
      operationId: savePlace
      tags: [landmarks]
      summary: Save a place for bookmarks and offline access (SRS 3.1.1.3.c, task 38)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [landmarkId]
              properties:
                landmarkId: { type: string, minLength: 1 }
                placeId: { type: string, minLength: 1 }
      responses:
        '201':
          description: Place saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SavedPlace' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

    get:
      operationId: listSavedPlaces
      tags: [landmarks]
      summary: List all saved places for the authenticated traveler
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Saved places
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SavedPlace' }
        '401': { $ref: '#/components/responses/Error' }

  /v1/me/saved-places/{landmarkId}:
    delete:
      operationId: removeSavedPlace
      tags: [landmarks]
      summary: Remove a saved place
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: landmarkId, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Place removed
        '401': { $ref: '#/components/responses/Error' }

components:
  parameters:
    LandmarkSearch: { name: q, in: query, schema: { type: string }, description: 'Matches name, district or category' }
    LandmarkCategory: { name: category, in: query, schema: { $ref: '#/components/schemas/LandmarkCategory' } }
    FreeAdmission: { name: free, in: query, schema: { type: string, enum: ['true', 'false'] } }
    MinimumRating: { name: minRating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
    DiscoveryLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase Auth access token

  responses:
    LandmarkList:
      description: Landmark summaries; an empty list when nothing matches
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/LandmarkSummary' } }
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, examples: [validation_error, not_found, unauthorized, bad_request, internal_error] }
                  message: { type: string }
                  details: {}

  schemas:
    PasswordRecoveryMessage:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message: { type: string }

    LandmarkCategory:
      type: string
      enum: [church, fort, monument, museum, heritage_house, temple]

    LandmarkStory:
      type: object
      required: [about, significance, architecture, trivia]
      properties:
        about: { type: string }
        significance: { type: string }
        architecture: { type: string }
        trivia: { type: string }

    LandmarkSummary:
      type: object
      required: [id, name, category, district, latitude, longitude, imageUrl, admissionFee, rating, visitCount, estimatedVisitMinutes, visitingHours]
      properties:
        id: { type: string }
        name: { type: string }
        category: { $ref: '#/components/schemas/LandmarkCategory' }
        district: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        imageUrl: { type: [string, 'null'] }
        admissionFee: { type: number, description: 'PHP; 0 means free' }
        rating: { type: number }
        visitCount: { type: integer }
        estimatedVisitMinutes: { type: integer }
        visitingHours: { type: string }
        distanceMeters: { type: integer, description: Present when lat/lng were supplied }

    Landmark:
      allOf:
        - $ref: '#/components/schemas/LandmarkSummary'
        - type: object
          required: [story]
          properties:
            story: { $ref: '#/components/schemas/LandmarkStory' }

    QuestProgress:
      type: object
      required: [id, title, description, badgeName, landmarkIds, completedLandmarkIds, completed]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        badgeName: { type: string }
        landmarkIds: { type: array, items: { type: string } }
        completedLandmarkIds: { type: array, items: { type: string } }
        completed: { type: boolean }

    Rank:
      type: object
      required: [level, title, xp, currentLevelXp, nextLevelXp]
      properties:
        level: { type: integer }
        title: { type: string }
        xp: { type: integer }
        currentLevelXp: { type: integer }
        nextLevelXp: { type: [integer, 'null'] }

    ProgressUpdate:
      type: object
      required: [xpAwarded, rank, leveledUp, newBadges]
      properties:
        xpAwarded: { type: integer }
        rank: { $ref: '#/components/schemas/Rank' }
        leveledUp: { type: boolean }
        newBadges: { type: array, items: { type: string } }

    ScanResult:
      type: object
      required: [status, confidence, landmark, candidates, progress]
      properties:
        status: { type: string, enum: [identified, low_confidence, not_nearby, unrecognized] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        landmark: { oneOf: [{ $ref: '#/components/schemas/Landmark' }, { type: 'null' }] }
        candidates: { type: array, items: { $ref: '#/components/schemas/LandmarkSummary' } }
        progress: { oneOf: [{ $ref: '#/components/schemas/ProgressUpdate' }, { type: 'null' }] }

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, model] }
        content: { type: string, minLength: 1, maxLength: 2000, description: Markdown for model replies }
        createdAt: { type: string, format: date-time, description: Optional client timestamp; always present on server replies }

    ChatReply:
      allOf:
        - $ref: '#/components/schemas/ChatMessage'
        - type: object
          required: [createdAt]
          properties:
            role: { type: string, const: model }
            createdAt: { type: string, format: date-time }

    Profile:
      type: object
      required: [id, displayName, avatarUrl, nationality, bio, language, xp, streakCount, lastActiveDate]
      properties:
        id: { type: string }
        displayName: { type: string }
        avatarUrl: { type: [string, 'null'] }
        nationality: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        language: { type: string, enum: [en, ceb] }
        xp: { type: integer }
        streakCount: { type: integer }
        lastActiveDate: { type: [string, 'null'], format: date }

    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        avatarUrl: { type: [string, 'null'], format: uri }
        nationality: { type: [string, 'null'], maxLength: 60 }
        bio: { type: [string, 'null'], maxLength: 280 }
        language: { type: string, enum: [en, ceb] }

    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    CommuteInput:
      type: object
      required: [origin, destinationLandmarkId]
      properties:
        origin: { $ref: '#/components/schemas/Coordinates' }
        destinationLandmarkId: { type: string, minLength: 1, maxLength: 200 }
        departureTime: { type: string, format: date-time, description: 'RFC 3339 timestamp. Accepts 7 days before through 100 days after the current time, inclusive, per Google Routes TRANSIT. Defaults to now. Values outside the window return HTTP 400 before contacting Google.' }
        preference: { type: string, enum: [LESS_WALKING, FEWER_TRANSFERS] }

    CommuteTransit:
      type: object
      required: [lineName, lineCode, vehicleType, headsign, departureStop, arrivalStop, departureTime, arrivalTime, stopCount, agencies]
      properties:
        lineName: { type: [string, 'null'] }
        lineCode: { type: [string, 'null'] }
        vehicleType: { type: [string, 'null'] }
        headsign: { type: [string, 'null'] }
        departureStop: { type: [string, 'null'] }
        arrivalStop: { type: [string, 'null'] }
        departureTime: { type: [string, 'null'], format: date-time }
        arrivalTime: { type: [string, 'null'], format: date-time }
        stopCount: { type: [integer, 'null'] }
        agencies:
          type: array
          items:
            type: object
            required: [name, uri]
            properties:
              name: { type: [string, 'null'] }
              uri: { type: [string, 'null'] }

    CommuteStep:
      type: object
      required: [travelMode, instruction, distanceMeters, durationSeconds, transit]
      properties:
        travelMode: { type: string, description: 'Google travel mode, usually WALK or TRANSIT' }
        instruction: { type: [string, 'null'] }
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        transit: { oneOf: [{ $ref: '#/components/schemas/CommuteTransit' }, { type: 'null' }] }

    CommuteRoute:
      type: object
      required: [distanceMeters, durationSeconds, encodedPolyline, fareText, steps]
      properties:
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        encodedPolyline: { type: [string, 'null'] }
        fareText: { type: [string, 'null'], description: 'Localized fare from Google if known; null does not mean free' }
        steps: { type: array, items: { $ref: '#/components/schemas/CommuteStep' } }

    CommuteResult:
      type: object
      required: [provider, status, destination, routes]
      properties:
        provider: { type: string, const: google_routes }
        status: { type: string, enum: [ok, no_routes] }
        destination:
          allOf:
            - $ref: '#/components/schemas/Coordinates'
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        routes: { type: array, maxItems: 4, items: { $ref: '#/components/schemas/CommuteRoute' } }

    Visit:
      type: object
      required: [id, userId, landmarkId, source, xpAwarded, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        landmarkId: { type: string }
        source: { type: string, enum: [scan, chat, manual] }
        xpAwarded: { type: integer }
        createdAt: { type: string, format: date-time }

    Me:
      type: object
      required: [profile, email, rank, stats, badges, recentVisits]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        email:
          type: [string, 'null']
          description: Email of the authenticated traveler, or null if the account has no email.
        rank: { $ref: '#/components/schemas/Rank' }
        stats:
          type: object
          properties:
            visitedCount: { type: integer }
            districtCoveragePercent: { type: integer }
            streakCount: { type: integer }
        badges:
          type: array
          items:
            type: object
            properties:
              questId: { type: string }
              name: { type: string }
        recentVisits: { type: array, items: { $ref: '#/components/schemas/Visit' } }

    SavedPlace:
      type: object
      required: [id, userId, landmarkId, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        landmarkId: { type: string }
        createdAt: { type: string, format: date-time }
        landmark: { $ref: '#/components/schemas/Landmark' }
